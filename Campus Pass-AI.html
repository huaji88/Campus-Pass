<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏫 校园通 · 智能高效好伙伴</title>
    <style>
        /* ===== 完整样式（与之前相同） ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(145deg, #f0f5fa 0%, #ffffff 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .app-container {
            width: 100%;
            max-width: 480px;
            height: 95vh;
            max-height: 820px;
            background: rgba(255, 255, 255, 0.50);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(0, 20, 40, 0.08), 0 4px 20px rgba(0, 0, 0, 0.02);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease;
        }
        #loginPage {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 40px 32px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(6px);
            text-align: center;
        }
        #loginPage .logo {
            font-size: 72px;
            margin-bottom: 6px;
            display: block;
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float {
            0%,
            100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        #loginPage h1 {
            font-size: 34px;
            font-weight: 700;
            color: #1a2a3a;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }
        #loginPage .subtitle {
            font-size: 16px;
            color: #6a7a8a;
            margin-bottom: 36px;
            font-weight: 400;
        }
        #loginPage .login-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 32px 24px 32px;
            box-shadow: 0 8px 32px rgba(0, 20, 40, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        #loginPage label {
            display: block;
            text-align: left;
            font-size: 14px;
            font-weight: 600;
            color: #1a2a3a;
            margin-bottom: 8px;
        }
        #loginPage input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid rgba(200, 210, 220, 0.3);
            border-radius: 16px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(4px);
            transition: all 0.2s;
            outline: none;
            color: #1a2a3a;
        }
        #loginPage input:focus {
            border-color: #4a8ad6;
            box-shadow: 0 0 0 4px rgba(74, 138, 214, 0.10);
            background: rgba(255, 255, 255, 0.9);
        }
        #loginPage .btn-primary {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 600;
            background: linear-gradient(135deg, #4a8ad6, #6a9ae6);
            color: #fff;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
            margin-top: 18px;
            box-shadow: 0 8px 24px rgba(74, 138, 214, 0.15);
        }
        #loginPage .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(74, 138, 214, 0.25);
        }
        #loginPage .btn-primary:active {
            transform: scale(0.97);
        }
        #loginPage .hint {
            margin-top: 16px;
            font-size: 13px;
            color: #7a8a9e;
        }
        #chatPage {
            display: none;
            flex-direction: column;
            height: 100%;
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(4px);
        }
        .chat-header {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(200, 210, 220, 0.2);
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.40);
            backdrop-filter: blur(12px);
            border-radius: 0 0 24px 24px;
        }
        .chat-header .left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .chat-header .title {
            font-size: 20px;
            font-weight: 700;
            color: #1a2a3a;
            letter-spacing: -0.3px;
        }
        .chat-header .title span {
            color: #4a8ad6;
        }
        .chat-header .right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .chat-header .user-badge {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(8px);
            padding: 6px 14px 6px 10px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            color: #2a5a8a;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            max-width: 120px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-header .user-badge .avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4a8ad6, #6a9ae6);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            flex-shrink: 0;
        }
        .chat-header .settings-btn {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(4px);
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
            color: #4a5a6a;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chat-header .settings-btn:hover {
            background: rgba(255, 255, 255, 0.6);
            color: #1a2a3a;
            transform: scale(1.05);
        }
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 18px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            scroll-behavior: smooth;
            background: rgba(255, 255, 255, 0.03);
        }
        .messages-container::-webkit-scrollbar {
            width: 4px;
        }
        .messages-container::-webkit-scrollbar-thumb {
            background: rgba(74, 138, 214, 0.2);
            border-radius: 10px;
        }
        .message-date-divider {
            text-align: center;
            font-size: 12px;
            color: #7a8a9e;
            margin: 12px 0 10px;
            position: relative;
            opacity: 0.6;
        }
        .message-date-divider span {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            padding: 4px 16px;
            border-radius: 20px;
            position: relative;
            z-index: 1;
        }
        .message-date-divider::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 1px;
            background: rgba(200, 210, 220, 0.3);
        }
        .message-item {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            animation: fadeInUp 0.3s ease-out;
            position: relative;
        }
        .message-item.self {
            align-self: flex-end;
            align-items: flex-end;
        }
        .message-item.other {
            align-self: flex-start;
            align-items: flex-start;
        }
        .message-item .checkbox {
            position: absolute;
            top: 20px;
            width: 18px;
            height: 18px;
            border-radius: 4px;
            border: 2px solid rgba(74, 138, 214, 0.4);
            background: rgba(255, 255, 255, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
        }
        .message-item.self .checkbox {
            left: -28px;
        }
        .message-item.other .checkbox {
            right: -28px;
        }
        .message-item .checkbox.checked {
            background: #4a8ad6;
            border-color: #4a8ad6;
        }
        .message-item .checkbox.checked::after {
            content: '✓';
            color: #fff;
            font-size: 12px;
            font-weight: bold;
        }
        .message-item.in-select-mode .checkbox {
            display: flex;
        }
        .message-item.self.in-select-mode {
            padding-left: 32px;
        }
        .message-item.other.in-select-mode {
            padding-right: 32px;
        }
        .message-item .msg-nickname {
            font-size: 12px;
            font-weight: 600;
            color: #4a6a8a;
            margin-bottom: 2px;
            padding-left: 4px;
            opacity: 0.7;
        }
        .message-item.self .msg-nickname {
            padding-right: 4px;
            color: #4a8ad6;
        }
        .message-item .bubble-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 6px;
        }
        .message-item .bubble {
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.5;
            word-break: break-word;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.02);
        }
        .message-item.self .bubble {
            background: linear-gradient(135deg, rgba(74, 138, 214, 0.15), rgba(106, 154, 230, 0.15));
            border-color: rgba(74, 138, 214, 0.2);
            color: #1a2a3a;
            border-bottom-right-radius: 4px;
        }
        .message-item.other .bubble {
            background: rgba(255, 255, 255, 0.6);
            border-color: rgba(255, 255, 255, 0.5);
            color: #1a2a3a;
            border-bottom-left-radius: 4px;
        }
        .message-item .bubble a {
            color: #4a8ad6;
            text-decoration: underline;
            word-break: break-all;
        }
        .message-item .msg-status {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            margin-left: 4px;
            width: 20px;
            height: 20px;
        }
        .msg-status .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(74, 138, 214, 0.2);
            border-top-color: #4a8ad6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .msg-status .status-sent {
            color: #34a853;
            font-weight: bold;
        }
        .msg-status .status-error {
            color: #ea4335;
            font-weight: bold;
        }
        .message-item .msg-time {
            font-size: 10px;
            color: #8a9aae;
            margin-top: 4px;
            padding: 0 6px;
            opacity: 0.6;
        }
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #8a9aae;
            text-align: center;
            padding: 20px;
        }
        .empty-state .empty-icon {
            font-size: 56px;
            margin-bottom: 12px;
            opacity: 0.4;
        }
        .empty-state .empty-title {
            font-size: 18px;
            font-weight: 600;
            color: #5a6a7e;
        }
        .selection-toolbar {
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 8px 20px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(200, 210, 220, 0.2);
            flex-shrink: 0;
        }
        .selection-toolbar.active {
            display: flex;
        }
        .selection-toolbar .info {
            font-size: 14px;
            color: #1a2a3a;
            font-weight: 500;
        }
        .selection-toolbar .actions {
            display: flex;
            gap: 12px;
        }
        .selection-toolbar .actions button {
            background: none;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: #1a2a3a;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
        }
        .selection-toolbar .actions button:hover {
            background: rgba(255, 255, 255, 0.4);
        }
        .selection-toolbar .actions .delete-btn {
            color: #ea4335;
        }
        .selection-toolbar .actions .delete-btn:hover {
            background: rgba(234, 67, 53, 0.1);
        }
        .chat-footer {
            padding: 12px 16px 14px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(200, 210, 220, 0.15);
            display: flex;
            align-items: flex-end;
            gap: 8px;
            flex-shrink: 0;
            border-radius: 0 0 40px 40px;
        }
        .chat-footer .input-wrap {
            flex: 1;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            padding: 4px 6px 4px 18px;
            display: flex;
            align-items: flex-end;
            border: 2px solid rgba(255, 255, 255, 0.3);
            transition: border 0.2s, background 0.2s;
            position: relative;
        }
        .chat-footer .input-wrap:focus-within {
            border-color: #4a8ad6;
            background: rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 0 4px rgba(74, 138, 214, 0.06);
        }
        .chat-footer .input-wrap textarea {
            flex: 1;
            border: none;
            background: transparent;
            resize: none;
            padding: 10px 0;
            font-size: 15px;
            outline: none;
            font-family: inherit;
            color: #1a2a3a;
            min-height: 24px;
            max-height: 100px;
            line-height: 1.4;
        }
        .chat-footer .input-wrap textarea::placeholder {
            color: #8a9aae;
        }
        .chat-footer .input-wrap .action-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 6px 6px 6px 4px;
            color: #7a8a9e;
            transition: all 0.2s;
            line-height: 1;
        }
        .chat-footer .input-wrap .action-btn:hover {
            color: #4a8ad6;
            transform: scale(1.1);
        }
        .emoji-picker {
            display: none;
            position: absolute;
            bottom: calc(100% + 8px);
            left: -10px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
            padding: 12px 14px;
            width: 320px;
            max-height: 220px;
            overflow-y: auto;
            z-index: 100;
            border: 1px solid rgba(0, 0, 0, 0.04);
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            justify-items: center;
        }
        .emoji-picker.active {
            display: grid;
        }
        .emoji-picker::-webkit-scrollbar {
            width: 3px;
        }
        .emoji-picker::-webkit-scrollbar-thumb {
            background: rgba(74, 138, 214, 0.2);
            border-radius: 10px;
        }
        .emoji-picker .emoji-item {
            font-size: 26px;
            cursor: pointer;
            padding: 4px;
            border-radius: 8px;
            transition: background 0.15s;
            text-align: center;
            line-height: 1.2;
            width: 36px;
        }
        .emoji-picker .emoji-item:hover {
            background: rgba(74, 138, 214, 0.08);
        }
        .chat-footer .send-btn {
            background: linear-gradient(135deg, #4a8ad6, #6a9ae6);
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
            box-shadow: 0 8px 24px rgba(74, 138, 214, 0.15);
        }
        .chat-footer .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 32px rgba(74, 138, 214, 0.25);
        }
        .chat-footer .send-btn:active {
            transform: scale(0.92);
        }
        .chat-footer .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .ninja-modal .modal-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .ninja-modal .modal-title .icon {
            font-size: 28px;
        }
        .function-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 16px 0 8px;
        }
        .function-card {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(200, 210, 220, 0.2);
            border-radius: 16px;
            padding: 14px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .function-card:hover {
            background: rgba(255, 255, 255, 0.8);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            border-color: #4a8ad6;
        }
        .function-card .emoji {
            font-size: 28px;
            display: block;
            margin-bottom: 4px;
        }
        .function-card .name {
            font-size: 14px;
            font-weight: 600;
            color: #1a2a3a;
        }
        .function-card .desc {
            font-size: 11px;
            color: #6a7a8a;
            margin-top: 2px;
        }
        .ninja-input-area {
            margin: 12px 0 16px;
        }
        .ninja-input-area label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #1a2a3a;
            margin-bottom: 4px;
        }
        .ninja-input-area .example {
            font-size: 12px;
            color: #6a7a8a;
            margin-bottom: 6px;
        }
        .ninja-input-area input {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid rgba(200, 210, 220, 0.2);
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(4px);
            color: #1a2a3a;
            transition: border 0.2s;
        }
        .ninja-input-area input:focus {
            border-color: #4a8ad6;
            background: rgba(255, 255, 255, 0.7);
        }
        .ninja-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 8px;
        }
        .ninja-actions .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .ninja-actions .btn-primary {
            background: linear-gradient(135deg, #4a8ad6, #6a9ae6);
            color: #fff;
            box-shadow: 0 4px 16px rgba(74, 138, 214, 0.15);
        }
        .ninja-actions .btn-primary:hover {
            box-shadow: 0 8px 24px rgba(74, 138, 214, 0.25);
            transform: translateY(-1px);
        }
        .ninja-actions .btn-secondary {
            background: rgba(200, 210, 220, 0.2);
            color: #3a4a5a;
        }
        .ninja-actions .btn-secondary:hover {
            background: rgba(200, 210, 220, 0.3);
        }
        .ninja-status-msg {
            margin-top: 12px;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 13px;
            display: none;
            text-align: center;
        }
        .ninja-status-msg.error {
            display: block;
            background: rgba(211, 47, 47, 0.06);
            color: #b33a3a;
            border: 1px solid rgba(211, 47, 47, 0.1);
        }
        .ninja-status-msg.success {
            display: block;
            background: rgba(46, 125, 50, 0.08);
            color: #2a7a3a;
            border: 1px solid rgba(46, 125, 50, 0.1);
        }
        .password-modal .modal-desc {
            margin-bottom: 12px;
        }
        .password-modal .modal-input {
            margin-bottom: 16px;
        }
        .custom-modal-overlay,
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.10);
            backdrop-filter: blur(8px);
            z-index: 1001;
            justify-content: center;
            align-items: center;
            padding: 24px;
            animation: fadeIn 0.3s ease;
            cursor: pointer;
        }
        .custom-modal-overlay.active,
        .modal-overlay.active {
            display: flex;
        }
        .custom-modal,
        .modal-box {
            background: rgba(255, 255, 255, 0.70);
            backdrop-filter: blur(30px);
            border-radius: 32px;
            max-width: 420px;
            width: 100%;
            padding: 28px 24px 24px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.4);
            animation: slideUp 0.3s ease;
            cursor: default;
        }
        .custom-modal .modal-title,
        .modal-box .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: #1a2a3a;
            text-align: center;
            margin-bottom: 4px;
        }
        .custom-modal .modal-desc,
        .modal-box .modal-sub {
            font-size: 14px;
            color: #6a7a8a;
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .custom-modal .modal-actions,
        .modal-box .modal-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .custom-modal .modal-actions .btn,
        .modal-box .modal-actions .btn {
            flex: 1;
            min-width: 80px;
            padding: 12px;
            border: none;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;

                });
                if (!resp.ok) {
                    let errMsg = 'HTTP ' + resp.status;
                    try {
                        const errData = await resp.json();
                        if (errData.message) errMsg = errData.message;
                    } catch (_) { /* ignore */ }
                    throw new Error(errMsg);
                }
                const data = await resp.json();
                return data.record?.messages || [];
            }

            async function updateMessagesToBin(apiKey, binId, msgs) {
                if (!apiKey || !binId) throw new Error('请先配置 API 密钥和 Bin ID');
                const url = `https://api.jsonbin.io/v3/b/${binId}`;
                const getResp = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'X-Master-Key': apiKey,
                        'Content-Type': 'application/json'
                    }
                });
                if (!getResp.ok) throw new Error('获取记录失败');
                const data = await getResp.json();
                const record = data.record || {};
                record.messages = msgs;
                const putResp = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'X-Master-Key': apiKey,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(record)
                });
                if (!putResp.ok) throw new Error('更新消息失败');
                return await putResp.json();
            }

            // ---- gofile 上传 ----
            async function uploadToGofile(file) {
                const serverResp = await fetch('https://api.gofile.io/servers');
                if (!serverResp.ok) throw new Error('获取服务器失败');
                const serverData = await serverResp.json();
                if (!serverData.status || serverData.status !== 'ok') throw new Error('服务器状态异常');
                const server = serverData.data.servers[0].name;
                const formData = new FormData();
                formData.append('file', file);
                const uploadResp = await fetch(`https://${server}.gofile.io/uploadFile`, {
                    method: 'POST',
                    body: formData
                });
                if (!uploadResp.ok) throw new Error('上传失败 (HTTP ' + uploadResp.status + ')');
                const uploadData = await uploadResp.json();
                if (!uploadData.status || uploadData.status !== 'ok') {
                    throw new Error(uploadData.data?.message || '上传失败');
                }
                return uploadData.data.downloadPage;
            }

            // ---- API Ninjas 调用 ----
            async function callNinjaAPI(endpoint, params) {
                if (!NINJA_API_KEY || NINJA_API_KEY === 'YOUR_FULL_API_KEY_HERE') {
                    throw new Error('请先设置正确的 NINJA_API_KEY（代码顶部）');
                }
                const url = new URL('https://api.api-ninjas.com/v1/' + endpoint);
                Object.keys(params).forEach(key => url.searchParams.append(key, params[key]));
                const resp = await fetch(url, {
                    headers: {
                        'X-Api-Key': NINJA_API_KEY
                    }
                });
                if (!resp.ok) {
                    let errMsg = 'API 请求失败 (HTTP ' + resp.status + ')';
                    if (resp.status === 401 || resp.status === 403) {
                        errMsg = 'API 密钥无效，请检查代码中的 NINJA_API_KEY';
                    } else if (resp.status === 429) {
                        errMsg = '请求频率过高，请稍后再试';
                    }
                    try {
                        const errData = await resp.json();
                        if (errData.error) errMsg = errData.error;
                    } catch (_) { /* ignore */ }
                    throw new Error(errMsg);
                }
                return await resp.json();
            }

                            let params = {};
                            if (input.includes(',')) {
                                const coords = input.split(',').map(s => s.trim());
                                if (coords.length === 2) {
                                    const lat = parseFloat(coords[0]);
                                    const lon = parseFloat(coords[1]);
                                    if (!isNaN(lat) && !isNaN(lon)) {
                                        params.lat = lat;
                                        params.lon = lon;
                                    } else {
                                        throw new Error('经纬度格式错误，请用逗号分隔，例如 31.23,121.47');
                                    }
                                } else {
                                    throw new Error('经纬度格式错误，请用逗号分隔，例如 31.23,121.47');

                            }

                        }
                        default:
                            throw new Error('未知功能');
                    }
                    return result;
                } catch (err) {
                    throw err;
                }

            // ---- 发送系统消息 ----
            async function sendNinjaMessage(content) {
                if (!content) return;
                if (!currentNickname) {
                    showToast('⚠️ 请先设置昵称', 'error', 2000);
                    return;
                }
                var config = getConfig();
                if (!config.apiKey || !config.binId) {
                    showToast('⚠️ 请先配置 JSONBin 服务', 'error', 3000);
                    openSettings();
                    return;
                }
                var msgId = generateId();
                var msgObj = {
                    id: msgId,
                    nickname: '🧙 宁贾斯助手',
                    content: content,
                    time: new Date().toISOString(),
                    status: 'sending'
                };
                messages.push(msgObj);
                localStatusMap.set(msgId, 'sending');
                renderMessages(messages);
                var success = await sendMessageInternal(msgObj, true);
                if (success) {
                    updateMessageStatus(msgId, 'sent');
                    renderMessages(messages);
                    await loadMessages(false);
                } else {
                    updateMessageStatus(msgId, 'error');
                    renderMessages(messages);
                    showToast('❌ 发送失败', 'error');
                }
            }

            // ---- 消息渲染 ----
            function renderMessages(msgs) {
                var sorted = msgs.slice().sort(function(a, b) { return new Date(a.time) - new Date(b.time); });
                var items = messagesContainer.querySelectorAll('.message-item, .message-date-divider');
                items.forEach(function(el) { el.remove(); });
                if (sorted.length === 0) {
                    emptyState.style.display = 'flex';
                    return;
                }
                emptyState.style.display = 'none';
                var lastDate = '';
                sorted.forEach(function(msg) {
                    var msgDate = formatDate(msg.time);
                    if (msgDate && msgDate !== lastDate) {
                        lastDate = msgDate;
                        var divider = document.createElement('div');
                        divider.className = 'message-date-divider';
                        divider.innerHTML = '<span>' + msgDate + '</span>';
                        messagesContainer.appendChild(divider);
                    }
                    var isSelf = msg.nickname === currentNickname;
                    var status = msg.status || 'sent';
                    var item = document.createElement('div');
                    item.className = 'message-item ' + (isSelf ? 'self' : 'other');
                    item.dataset.id = msg.id;
                    var checkbox = document.createElement('div');
                    checkbox.className = 'checkbox';
                    if (selectedIds.has(msg.id)) {
                        checkbox.classList.add('checked');
                    }
                    item.appendChild(checkbox);
                    var nameEl = document.createElement('div');
                    nameEl.className = 'msg-nickname';
                    nameEl.textContent = isSelf ? '我' : msg.nickname;
                    item.appendChild(nameEl);
                    var wrapper = document.createElement('div');
                    wrapper.className = 'bubble-wrapper';
                    var bubble = document.createElement('div');
                    bubble.className = 'bubble';
                    bubble.innerHTML = linkify(msg.content);
                    wrapper.appendChild(bubble);
                    if (isSelf) {
                        var statusEl = document.createElement('span');
                        statusEl.className = 'msg-status';
                        statusEl.title = status === 'sending' ? '发送中...' :
                            status === 'sent' ? '已发送' :
                            '发送失败，请重试';
                        if (status === 'sending') {
                            var spinner = document.createElement('span');
                            spinner.className = 'spinner';
                            statusEl.appendChild(spinner);
                        } else if (status === 'sent') {
                            statusEl.innerHTML = '✓';
                            statusEl.className += ' status-sent';
                        } else if (status === 'error') {
                            statusEl.innerHTML = '✗';
                            statusEl.className += ' status-error';
                        }
                        wrapper.appendChild(statusEl);
                    }
                    item.appendChild(wrapper);
                    var timeEl = document.createElement('div');
                    timeEl.className = 'msg-time';
                    timeEl.textContent = formatTime(msg.time);
                    item.appendChild(timeEl);

                    // 点击切换选择
                    item.addEventListener('click', function(e) {
                        if (selectMode) {
                            e.stopPropagation();
                            toggleSelectItem(msg.id);
                        }
                    });

                    // 长按进入选择模式
                    var longPressTimer = null;
                    item.addEventListener('mousedown', function(e) {
                        if (selectMode) return;
                        longPressTimer = setTimeout(function() {
                            enterSelectMode(msg.id);
                        }, 500);
                    });
                    item.addEventListener('mouseup', function() { clearTimeout(longPressTimer); });
                    item.addEventListener('mouseleave', function() { clearTimeout(longPressTimer); });
                    item.addEventListener('touchstart', function(e) {
                        if (selectMode) return;
                        longPressTimer = setTimeout(function() {
                            enterSelectMode(msg.id);
                        }, 500);
                    });
                    item.addEventListener('touchend', function() { clearTimeout(longPressTimer); });
                    item.addEventListener('touchmove', function() { clearTimeout(longPressTimer); });

                    messagesContainer.appendChild(item);
                });
                scrollToBottom();
                updateSelectionInfo();
            }

            function scrollToBottom() {
                requestAnimationFrame(function() {
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                });
            }

            function updateMessageStatus(id, status) {
                var msg = messages.find(function(m) { return m.id === id; });
                if (msg) {
                    msg.status = status;
                    localStatusMap.set(id, status);
                }
            }

            function mergeMessages(serverMsgs) {
                return serverMsgs.map(function(msg) {
                    var localStatus = localStatusMap.get(msg.id);
                    if (localStatus) {
                        return { ...msg, status: localStatus };
                    }
                    return { ...msg, status: 'sent' };
                });
            }

            // ---- 选择模式 ----
            function enterSelectMode(initialId) {
                selectMode = true;
                selectedIds.clear();
                if (initialId) selectedIds.add(initialId);
                document.querySelectorAll('.message-item').forEach(function(el) {
                    el.classList.add('in-select-mode');
                    var cb = el.querySelector('.checkbox');
                    if (cb && selectedIds.has(el.dataset.id)) {
                        cb.classList.add('checked');
                    }
                });
                selectionToolbar.classList.add('active');
                updateSelectionInfo();
                showToast('选择消息后点击删除', 'info', 2000);
            }

            function exitSelectMode() {
                selectMode = false;
                selectedIds.clear();
                document.querySelectorAll('.message-item').forEach(function(el) {
                    el.classList.remove('in-select-mode');
                    var cb = el.querySelector('.checkbox');
                    if (cb) cb.classList.remove('checked');
                });
                selectionToolbar.classList.remove('active');
            }

            function toggleSelectItem(id) {
                if (selectedIds.has(id)) {
                    selectedIds.delete(id);
                } else {
                    selectedIds.add(id);
                }
                var item = document.querySelector('.message-item[data-id="' + id + '"]');
                if (item) {
                    var cb = item.querySelector('.checkbox');
                    if (cb) {
                        if (selectedIds.has(id)) cb.classList.add('checked');
                        else cb.classList.remove('checked');
                    }
                }
                updateSelectionInfo();
            }

            function updateSelectionInfo() {
                var count = selectedIds.size;
                selectionInfo.textContent = '已选 ' + count + ' 条';
            }

            async function deleteSelectedMessages() {
                if (selectedIds.size === 0) {
                    showToast('请选择要删除的消息', 'error');
                    return;
                }
                var result = await showPasswordModal('请输入删除密码');
                if (result.action === 'cancel') {
                    showToast('操作已取消', 'info');
                    return;
                }
                var password = result.password;
                if (password !== DELETE_PASSWORD) {
                    showToast('密码错误，删除取消', 'error');
                    return;
                }

                var idsToDelete = new Set(selectedIds);
                var newMessages = messages.filter(function(msg) { return !idsToDelete.has(msg.id); });
                messages = newMessages;
                idsToDelete.forEach(function(id) { localStatusMap.delete(id); });

                var config = getConfig();
                if (!config.apiKey || !config.binId) {
                    showToast('⚠️ 请先配置 JSONBin', 'error');
                    return;
                }
                try {
                    await updateMessagesToBin(config.apiKey, config.binId, newMessages);
                    showToast('✅ 已删除 ' + idsToDelete.size + ' 条消息', 'success');
                    renderMessages(messages);
                    exitSelectMode();
                } catch (err) {
                    showToast('删除失败: ' + err.message, 'error');
                }
            }

            // ---- 加载消息 ----
            async function loadMessages(showLoading) {
                if (showLoading === undefined) showLoading = true;
                var config = getConfig();
                if (!config.apiKey || !config.binId) {
                    isConfigValid = false;
                    if (showLoading) {
                        renderMessages([]);
                        showToast('⚠️ 请先配置 JSONBin 服务', 'error', 3000);
                        openSettings();
                    }
                    return;
                }
                isConfigValid = true;
                try {
                    var serverMsgs = await fetchMessagesFromBin(config.apiKey, config.binId);
                    var mergedMsgs = mergeMessages(serverMsgs);
                    messages = mergedMsgs;
                    renderMessages(messages);
                    if (isFirstLoad) {
                        isFirstLoad = false;
                        if (messages.length === 0) {
                            var welcomeMsg = {
                                id: generateId(),
                                nickname: '🏫 校园通',
                                content: '👋 欢迎！长按消息可多选删除',
                                time: new Date().toISOString(),
                                status: 'sent'
                            };
                            await sendMessageInternal(welcomeMsg, true);
                        }
                    }
                } catch (err) {
                    console.error('加载消息失败:', err);
                    showToast('📡 加载消息失败: ' + err.message, 'error', 3000);
                    if (err.message.includes('配置') || err.message.includes('API') || err.message.includes('HTTP 401') || err
                        .message.includes('403')) {
                        openSettings();
                    }
                }
            }

            // ---- 发送消息内部 ----
            async function sendMessageInternal(msgObj, silent) {
                if (silent === undefined) silent = false;
                var config = getConfig();
                if (!config.apiKey || !config.binId) {
                    if (!silent) showToast('⚠️ 请先配置 JSONBin 服务', 'error', 3000);
                    openSettings();
                    return false;
                }
                try {
                    var currentMsgs = [];
                    try {
                        currentMsgs = await fetchMessagesFromBin(config.apiKey, config.binId);
                    } catch (_) {
                        currentMsgs = [];
                    }
                    var serverMsg = { ...msgObj };
                    delete serverMsg.status;
                    currentMsgs.push(serverMsg);
                    await updateMessagesToBin(config.apiKey, config.binId, currentMsgs);
                    return true;
                } catch (err) {
                    console.error('发送消息失败:', err);
                    if (!silent) {
                        showToast('❌ 发送失败: ' + err.message, 'error', 3000);
                    }
                    return false;
                }
            }

                if (content === undefined) content = msgInput.value.trim();
                if (!content) {
                    msgInput.focus();
                    return;
                }
                if (!currentNickname) {
                    showToast('⚠️ 请先设置昵称', 'error', 2000);

                }

                }

                attachBtn.disabled = true;

                sendBtn.disabled = false;

            // ---- 文件上传 ----
            async function handleFileUpload() {
                if (isSending) return;
                if (!currentNickname) {
                    showToast('⚠️ 请先设置昵称', 'error', 2000);
                    return;
                }
                var config = getConfig();
                if (!config.apiKey || !config.binId) {
                    showToast('⚠️ 请先配置 JSONBin 服务', 'error', 3000);
                    openSettings();
                    return;
                }
                var result = await showUploadModal();
                if (result.action === 'cancel') return;
                var input = document.createElement('input');
                input.type = 'file';
                input.style.display = 'none';
                document.body.appendChild(input);
                input.onchange = async function(e) {
                    var file = e.target.files[0];
                    if (!file) {
                        document.body.removeChild(input);
                        return;
                    }
                    try {
                        showToast('正在上传到 gofile.io ...', 'info');
                        var link = await uploadToGofile(file);
                        var fileSize = (file.size / 1024).toFixed(1) + ' KB';
                        var content = '📎 ' + file.name + ' (' + fileSize + ') 下载: ' + link;
                        await sendUserMessage(content);
                    } catch (err) {
                        showToast('上传失败: ' + err.message, 'error', 4000);
                    } finally {
                        document.body.removeChild(input);
                    }
                };
                input.click();
            }

            }, {

                emoji: '🌤️',
                name: '天气 Weather',
                desc: '查询城市天气',
                placeholder: '城市名',
                example: '温州'
            }, {
                id: 'nutrition',
                emoji: '🍎',
                name: '营养 Nutrition',
                desc: '查询食物营养',
                placeholder: '食物名',
                example: '苹果'
            }, {
                id: 'exercise',
                emoji: '💪',
                name: '健身动作 Exercise',
                desc: '按肌肉组查询',
                placeholder: '肌肉组 (chest/back/legs)',
                example: 'chest'
            }, {
                id: 'stock',
                emoji: '📈',
                name: '股票 Stock',
                desc: '股票实时行情',
                placeholder: '股票代码',
                example: 'AAPL'
            }, {
                id: 'crypto',
                emoji: '₿',
                name: '加密 Crypto',
                desc: '加密货币价格',
                placeholder: '代码 (如 BTC)',
                example: 'BTC'
            }, {
                id: 'calories',
                emoji: '🔥',
                name: '卡路里 Calories',
                desc: '计算运动消耗（活动名用英文）',
                placeholder: '活动,体重,时长',
                example: 'running,70,30'
            }, {
                id: 'airports',
                emoji: '✈️',
                name: '机场 Airports',
                desc: '机场信息',
                placeholder: '机场名 或 纬度,经度',
                example: '浦东 或 31.23,121.47'
            }];

            function renderNinjaFunctions() {
                functionGrid.innerHTML = '';
                ninjaFunctions.forEach(function(fn) {
                    var card = document.createElement('div');
                    card.className = 'function-card';
                    card.dataset.id = fn.id;
                    card.innerHTML = `
                        <span class="emoji">${fn.emoji}</span>
                        <div class="name">${fn.name}</div>
                        <div class="desc">${fn.desc}</div>
                    `;
                    card.addEventListener('click', function() {
                        selectNinjaFunction(fn.id);
                    });
                    functionGrid.appendChild(card);
                });
            }
            renderNinjaFunctions();

            function selectNinjaFunction(id) {
                var fn = ninjaFunctions.find(f => f.id === id);
                if (!fn) return;
                currentNinjaFunction = fn;
                ninjaInputLabel.textContent = fn.emoji + ' ' + fn.name + ' - 请输入';
                ninjaInputExample.textContent = '示例：' + fn.example;
                ninjaInput.placeholder = fn.placeholder;
                ninjaInput.value = '';
                ninjaInputArea.style.display = 'block';
                ninjaStatusMsg.className = 'ninja-status-msg';
                ninjaStatusMsg.textContent = '';
                ninjaInput.focus();
            }

            function openNinjaPanel() {
                ninjaInputArea.style.display = 'none';
                currentNinjaFunction = null;
                ninjaStatusMsg.className = 'ninja-status-msg';
                ninjaStatusMsg.textContent = '';
                showNinjaModal();
            }

            // 提交查询（已修复）
            ninjaSubmitBtn.addEventListener('click', async function() {
                if (!currentNinjaFunction) {
                    ninjaStatusMsg.className = 'ninja-status-msg error';
                    ninjaStatusMsg.textContent = '请先选择一个功能';
                    return;
                }
                var userInput = ninjaInput.value.trim();
                if (!userInput) {
                    ninjaStatusMsg.className = 'ninja-status-msg error';
                    ninjaStatusMsg.textContent = '请输入查询内容';
                    return;
                }
                var fn = currentNinjaFunction;
                hideNinjaModal();
                showToast('⏳ 查询中...', 'info');
                try {
                    var result = await handleNinjaQuery(fn.id, userInput);
                    if (result) {
                        await sendNinjaMessage(result);
                        showToast('✅ 查询结果已发送', 'success');
                    } else {
                        showToast('查询失败，请检查输入或网络', 'error');
                    }
                } catch (err) {
                    showToast('查询失败: ' + err.message, 'error', 4000);
                }
            });

            // 点击宁贾斯按钮 → 管理员密码验证
            ninjaBtn.addEventListener('click', function() {
                if (isSending) return;
                if (!currentNickname) {
                    showToast('⚠️ 请先设置昵称', 'error', 2000);
                    return;
                }
                var config = getConfig();
                if (!config.apiKey || !config.binId) {
                    showToast('⚠️ 请先配置 JSONBin 服务', 'error', 3000);
                    openSettings();
                    return;
                }
                if (!NINJA_API_KEY || NINJA_API_KEY === 'YOUR_FULL_API_KEY_HERE') {
                    showToast('⚠️ 请先设置正确的 NINJA_API_KEY（代码顶部）', 'error', 3000);
                    return;
                }
                showAdminPasswordModal();
            });

            // ---- 轮询 ----
            function startPolling() {
                stopPolling();
                pollingTimer = setInterval(async function() {
                    var config = getConfig();
                    if (!config.apiKey || !config.binId) return;
                    try {
                        var serverMsgs = await fetchMessagesFromBin(config.apiKey, config.binId);
                        var merged = mergeMessages(serverMsgs);
                        if (merged.length !== messages.length) {
                            messages = merged;
                            renderMessages(messages);
                        } else {
                            var changed = false;
                            for (var i = 0; i < merged.length; i++) {
                                var a = messages[i];
                                var b = merged[i];
                                if (a.id !== b.id || a.content !== b.content || a.nickname !== b.nickname) {
                                    changed = true;
                                    break;
                                }
                            }
                            if (changed) {
                                messages = merged;
                                renderMessages(messages);
                            }
                        }
                    } catch (err) {
                        console.warn('轮询失败:', err.message);
                    }
                }, 3000);
            }

            function stopPolling() {
                if (pollingTimer) {
                    clearInterval(pollingTimer);
                    pollingTimer = null;
                }
            }

            // ---- UI 控制 ----
            function enterChat() {
                var name = nicknameInput.value.trim();
                if (!name) {
                    showToast('⚠️ 请输入你的昵称', 'error', 2000);
                    nicknameInput.focus();
                    return;
                }
                currentNickname = name;
                saveNickname(name);
                userBadgeName.textContent = name;
                userAvatar.textContent = name.charAt(0).toUpperCase();
                loginPage.style.display = 'none';
                chatPage.style.display = 'flex';
                isFirstLoad = true;
                loadMessages(true);
                startPolling();
                msgInput.focus();
            }

            function openSettings() {
                var config = getConfig();
                apiKeyInput.value = config.apiKey || '';
                binIdInput.value = config.binId || '';
                settingsStatus.className = 'status-msg';
                settingsStatus.textContent = '';
                settingsModal.classList.add('active');
            }

            function closeSettings() {
                settingsModal.classList.remove('active');
            }

            async function saveSettings() {
                var apiKey = apiKeyInput.value.trim();
                var binId = binIdInput.value.trim();

                if (!apiKey || !binId) {
                    settingsStatus.className = 'status-msg error';
                    settingsStatus.textContent = '⚠️ 请填写完整的 JSONBin 密钥和 Bin ID';
                    settingsStatus.style.display = 'block';
                    return;
                }

                settingsStatus.className = 'status-msg';
                settingsStatus.textContent = '⏳ 测试 JSONBin 连接...';
                settingsStatus.style.display = 'block';

                try {
                    await fetchMessagesFromBin(apiKey, binId);
                    saveConfig(apiKey, binId);
                    settingsStatus.className = 'status-msg success';
                    settingsStatus.textContent = '✅ 配置已保存，JSONBin 连接成功！';
                    settingsStatus.style.display = 'block';
                    isConfigValid = true;
                    showToast('✅ 配置已保存', 'success', 2000);
                } catch (err) {
                    settingsStatus.className = 'status-msg error';
                    settingsStatus.textContent = '❌ JSONBin 连接失败: ' + err.message;
                    settingsStatus.style.display = 'block';
                    showToast('❌ 连接失败，请检查配置', 'error', 3000);
                }
            }

            async function applyDefaultSettings() {
                var result = await showPasswordModal('请输入默认配置密码');
                if (result.action === 'cancel') {
                    showToast('操作已取消', 'info');
                    return;
                }
                var password = result.password;
                if (password !== PRESET_PASSWORD) {
                    showToast('❌ 密码错误，无法应用默认配置', 'error', 2500);
                    return;
                }
                if (PRESET_API_KEY === '你的默认API密钥' || PRESET_BIN_ID === '你的默认Bin ID') {
                    showToast('⚠️ 预设配置未设置，请先修改代码中的 PRESET_API_KEY 和 PRESET_BIN_ID', 'error', 4000);
                    return;
                }
                saveConfig(PRESET_API_KEY, PRESET_BIN_ID);
                apiKeyInput.value = '';
                binIdInput.value = '';
                settingsStatus.className = 'status-msg success';
                settingsStatus.textContent = '✅ 已应用默认配置（密钥已隐藏）';
                settingsStatus.style.display = 'block';
                isConfigValid = true;
                showToast('✅ 默认配置已应用', 'success', 2000);
            }

            // ---- 表情 ----
            var faceEmojis = [
                '😀', '😁', '😂', '🤣', '😃', '😄', '😅', '😆', '😉', '😊', '😋', '😎',
                '😍', '🥰', '😘', '😗', '😙', '😚', '☺️', '🙂', '🤗', '🤩', '🤔', '🤨',
                '😐', '😑', '😶', '🙄', '😏', '😣', '😥', '😮', '🤐', '😯', '😪', '😫',
                '😴', '😌', '😛', '😜', '😝', '🤤', '😒', '😓', '😔', '😕', '🙃', '🤑',
                '😲', '☹️', '🙁', '😖', '😞', '😟', '😤', '😢', '😭', '😦', '😧', '😨',
                '😩', '🤯', '😬', '😰', '😱', '🥵', '🥶', '😳', '🤪', '😵', '😡', '😠',
                '🤬', '😷', '🤒', '🤕', '🤢', '🤮', '🥴', '😵‍💫', '🤧', '🥳', '🥺', '🧐',
                '🤓', '😈', '👿', '👹', '👺', '💀', '👻', '👽', '🤖', '🎃', '😺', '😸',
                '😹', '😻', '😼', '😽', '🙀', '😿', '😾',
                '👍', '👎', '👏', '🙌', '🤝', '💪', '🖐️', '✌️', '🤞', '🤙', '👌', '✋', '👊', '🤛', '🤜'
            ];

            function buildEmojiPicker() {
                emojiPicker.innerHTML = '';
                faceEmojis.forEach(function(emoji) {
                    var span = document.createElement('span');
                    span.className = 'emoji-item';
                    span.textContent = emoji;
                    span.dataset.emoji = emoji;
                    span.addEventListener('click', function(e) {
                        e.stopPropagation();
                        var emojiChar = span.dataset.emoji;
                        insertEmojiAtCursor(emojiChar);
                        emojiPicker.classList.remove('active');
                    });
                    emojiPicker.appendChild(span);
                });
            }
            buildEmojiPicker();

            function insertEmojiAtCursor(emoji) {
                var start = msgInput.selectionStart;
                var end = msgInput.selectionEnd;
                var current = msgInput.value;
                msgInput.value = current.substring(0, start) + emoji + current.substring(end);
                msgInput.focus();
                var newPos = start + emoji.length;
                msgInput.setSelectionRange(newPos, newPos);
                autoResizeTextarea();
            }

            function toggleEmojiPicker(e) {
                e.stopPropagation();
                var isActive = emojiPicker.classList.contains('active');
                emojiPicker.classList.toggle('active');
                if (!isActive) {
                    document.addEventListener('click', closeEmojiPickerOutside);
                } else {
                    document.removeEventListener('click', closeEmojiPickerOutside);
                }
            }

            function closeEmojiPickerOutside(e) {
                if (!emojiPicker.contains(e.target) && e.target !== emojiBtn) {
                    emojiPicker.classList.remove('active');
                    document.removeEventListener('click', closeEmojiPickerOutside);
                }
            }

            function autoResizeTextarea() {
                msgInput.style.height = 'auto';
                msgInput.style.height = Math.min(msgInput.scrollHeight, 100) + 'px';
            }

            function onKeydown(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    var content = msgInput.value.trim();
                    if (content) {
                        sendUserMessage(content);
                    }
                }
            }

            // 选择模式按钮
            cancelSelectBtn.addEventListener('click', exitSelectMode);
            deleteSelectedBtn.addEventListener('click', deleteSelectedMessages);

            // ---- 初始化 ----
            function init() {
                var savedName = getNickname();
                if (savedName) {
                    nicknameInput.value = savedName;
                    currentNickname = savedName;
                }
                var config = getConfig();
                if (config.apiKey && config.binId) {
                    isConfigValid = true;
                } else {
                    setTimeout(function() {
                        if (!isConfigValid) {
                            showToast('📡 首次使用，请配置 JSONBin 服务', 'info', 4000);
                            openSettings();
                        }
                    }, 800);
                }

                if (!NINJA_API_KEY || NINJA_API_KEY === 'YOUR_FULL_API_KEY_HERE') {
                    console.warn('⚠️ 请设置正确的 NINJA_API_KEY');
                }

                // 事件绑定
                enterChatBtn.addEventListener('click', enterChat);
                nicknameInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') enterChat();
                });
                sendBtn.addEventListener('click', function() {
                    var content = msgInput.value.trim();
                    if (content) sendUserMessage(content);
                });
                msgInput.addEventListener('keydown', onKeydown);
                msgInput.addEventListener('input', autoResizeTextarea);
                emojiBtn.addEventListener('click', toggleEmojiPicker);
                attachBtn.addEventListener('click', handleFileUpload);
                settingsBtn.addEventListener('click', openSettings);
                settingsCancelBtn.addEventListener('click', closeSettings);
                settingsSaveBtn.addEventListener('click', saveSettings);
                defaultSettingsBtn.addEventListener('click', applyDefaultSettings);
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape' && settingsModal.classList.contains('active')) {
                        closeSettings();
                    }
                    if (e.key === 'Escape' && ninjaModal.classList.contains('active')) {
                        hideNinjaModal();
                        if (modalResolve) { modalResolve({ action: 'cancel' });
                            modalResolve = null; }
                    }
                    if (e.key === 'Escape' && passwordVerifyModal.classList.contains('active')) {
                        hideAdminPasswordModal();
                        if (modalResolve) { modalResolve({ action: 'cancel' });
                            modalResolve = null; }
                    }
                });
                if (!savedName) {
                    setTimeout(function() { nicknameInput.focus(); }, 400);
                } else {
                    setTimeout(function() {
                        if (loginPage.style.display !== 'none') {
                            nicknameInput.focus();
                        }
                    }, 400);
                }
            }
            init();
        })();
    </script>
