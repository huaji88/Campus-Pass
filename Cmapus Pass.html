<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏫 校园通 · 完整版</title>
    <style>
        /* ===== 全局重置 & 基础 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(145deg, #d4dcec 0%, #e9eef4 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 16px;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 95vh;
            max-height: 820px;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 40px;
            box-shadow: 0 30px 80px rgba(0, 20, 40, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        /* ===== 登录页面 ===== */
        #loginPage {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 40px 32px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            text-align: center;
        }

        #loginPage .logo {
            font-size: 64px;
            margin-bottom: 8px;
            display: block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-12px);
            }
        }

        #loginPage h1 {
            font-size: 32px;
            font-weight: 700;
            color: #1a2a3a;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.05);
        }

        #loginPage .subtitle {
            font-size: 15px;
            color: #4a5a6a;
            margin-bottom: 36px;
            font-weight: 400;
            opacity: 0.8;
        }

        #loginPage .login-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 28px 24px 32px;
            box-shadow: 0 8px 32px rgba(0, 20, 40, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        #loginPage label {
            display: block;
            text-align: left;
            font-size: 14px;
            font-weight: 600;
            color: #1a2a3a;
            margin-bottom: 8px;
        }

        #loginPage input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 16px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(5px);
            transition: border 0.2s, box-shadow 0.2s;
            outline: none;
            color: #1a2a3a;
        }

        #loginPage input:focus {
            border-color: #4a8ad6;
            box-shadow: 0 0 0 4px rgba(74, 138, 214, 0.15);
            background: rgba(255, 255, 255, 0.8);
        }

        #loginPage .btn-primary {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 600;
            background: linear-gradient(135deg, #4a8ad6, #3a7ac6);
            color: #fff;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
            margin-top: 18px;
            letter-spacing: 0.3px;
            box-shadow: 0 8px 24px rgba(74, 138, 214, 0.25);
        }

        #loginPage .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(74, 138, 214, 0.35);
        }

        #loginPage .btn-primary:active {
            transform: scale(0.97);
        }

        #loginPage .hint {
            margin-top: 16px;
            font-size: 13px;
            color: #5a6a7a;
        }

        /* ===== 聊天主界面 ===== */
        #chatPage {
            display: none;
            flex-direction: column;
            height: 100%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
        }

        /* ----- 顶部栏 ----- */
        .chat-header {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 0 0 20px 20px;
        }

        .chat-header .left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header .back-icon {
            font-size: 22px;
            cursor: pointer;
            color: #4a5a6a;
            transition: color 0.2s;
        }
        .chat-header .back-icon:hover {
            color: #1a2a3a;
        }

        .chat-header .title {
            font-size: 18px;
            font-weight: 700;
            color: #1a2a3a;
            letter-spacing: -0.3px;
        }
        .chat-header .title span {
            color: #4a8ad6;
        }

        .chat-header .right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-header .user-badge {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(5px);
            padding: 6px 14px 6px 10px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            color: #2a5a8a;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 120px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-header .user-badge .avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4a8ad6, #6a9ae6);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .chat-header .settings-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #4a5a6a;
            padding: 4px 6px;
            border-radius: 10px;
            transition: all 0.2s;
        }
        .chat-header .settings-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            color: #1a2a3a;
        }

        /* ----- 消息列表 ----- */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 18px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            scroll-behavior: smooth;
            background: rgba(255, 255, 255, 0.05);
        }

        .messages-container::-webkit-scrollbar {
            width: 4px;
        }
        .messages-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .messages-container::-webkit-scrollbar-thumb {
            background: rgba(74, 138, 214, 0.3);
            border-radius: 10px;
        }

        .message-date-divider {
            text-align: center;
            font-size: 12px;
            color: #5a6a7a;
            margin: 12px 0 10px;
            position: relative;
            opacity: 0.7;
        }
        .message-date-divider span {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(5px);
            padding: 4px 16px;
            border-radius: 20px;
            position: relative;
            z-index: 1;
        }
        .message-date-divider::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
        }

        /* ----- 消息气泡 ----- */
        .message-item {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            animation: fadeInUp 0.3s ease-out;
            transition: all 0.2s;
            position: relative;
        }

        .message-item.selectable {
            cursor: pointer;
        }

        /* ===== 复选框位置优化 ===== */
        /* 自己的消息（靠右）→ 复选框放左侧 */
        .message-item.self .checkbox {
            position: absolute;
            left: -28px;
            top: 20px;
            width: 18px;
            height: 18px;
            border-radius: 4px;
            border: 2px solid rgba(74, 138, 214, 0.4);
            background: rgba(255, 255, 255, 0.3);
            display: none;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            backdrop-filter: blur(5px);
        }

        /* 他人的消息（靠左）→ 复选框放右侧 */
        .message-item.other .checkbox {
            position: absolute;
            right: -28px;
            top: 20px;
            width: 18px;
            height: 18px;
            border-radius: 4px;
            border: 2px solid rgba(74, 138, 214, 0.4);
            background: rgba(255, 255, 255, 0.3);
            display: none;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            backdrop-filter: blur(5px);
        }

        .message-item .checkbox.checked {
            background: #4a8ad6;
            border-color: #4a8ad6;
        }
        .message-item .checkbox.checked::after {
            content: '✓';
            color: #fff;
            font-size: 12px;
            font-weight: bold;
        }

        .message-item.in-select-mode .checkbox {
            display: flex;
        }
        /* 自己的消息左侧内边距，给复选框留空间 */
        .message-item.self.in-select-mode {
            padding-left: 32px;
        }
        /* 他人的消息右侧内边距，给复选框留空间 */
        .message-item.other.in-select-mode {
            padding-right: 32px;
        }

        .message-item.self {
            align-self: flex-end;
            align-items: flex-end;
        }
        .message-item.other {
            align-self: flex-start;
            align-items: flex-start;
        }

        .message-item .msg-nickname {
            font-size: 12px;
            font-weight: 600;
            color: #4a6a8a;
            margin-bottom: 2px;
            padding-left: 4px;
            opacity: 0.8;
        }
        .message-item.self .msg-nickname {
            padding-right: 4px;
            color: #4a8ad6;
        }

        .message-item .bubble-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 6px;
        }

        .message-item .bubble {
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.5;
            word-break: break-word;
            position: relative;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
        }

        .message-item.self .bubble {
            background: linear-gradient(135deg, rgba(74, 138, 214, 0.8), rgba(90, 154, 230, 0.8));
            backdrop-filter: blur(10px);
            color: #fff;
            border-bottom-right-radius: 4px;
            border-color: rgba(255, 255, 255, 0.2);
        }

        .message-item.other .bubble {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            color: #1a2a3a;
            border-bottom-left-radius: 4px;
            border-color: rgba(255, 255, 255, 0.4);
        }

        .message-item .bubble a {
            color: #4a8ad6;
            text-decoration: underline;
            word-break: break-all;
        }

        .message-item .msg-status {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            margin-left: 4px;
            flex-shrink: 0;
            width: 20px;
            height: 20px;
        }

        .msg-status .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .message-item.other .msg-status .spinner {
            border: 2px solid rgba(0, 0, 0, 0.15);
            border-top-color: #4a8ad6;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .msg-status .status-sent {
            color: #34a853;
            font-weight: bold;
        }
        .msg-status .status-error {
            color: #ea4335;
            font-weight: bold;
            cursor: help;
        }

        .message-item .msg-time {
            font-size: 10px;
            color: #5a6a7a;
            margin-top: 4px;
            padding: 0 6px;
            opacity: 0.7;
        }
        .message-item.self .msg-time {
            color: #7a9abe;
        }

        /* ----- 空状态 ----- */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #5a6a7a;
            text-align: center;
            padding: 20px;
            opacity: 0.6;
        }
        .empty-state .empty-icon {
            font-size: 56px;
            margin-bottom: 12px;
        }
        .empty-state .empty-title {
            font-size: 17px;
            font-weight: 600;
            color: #3a4a5a;
        }
        .empty-state .empty-desc {
            font-size: 14px;
        }

        /* ----- 选择模式工具栏 ----- */
        .selection-toolbar {
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 8px 20px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
        }
        .selection-toolbar.active {
            display: flex;
        }
        .selection-toolbar .info {
            font-size: 14px;
            color: #1a2a3a;
            font-weight: 500;
        }
        .selection-toolbar .actions {
            display: flex;
            gap: 12px;
        }
        .selection-toolbar .actions button {
            background: none;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: #1a2a3a;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
        }
        .selection-toolbar .actions button:hover {
            background: rgba(255, 255, 255, 0.4);
        }
        .selection-toolbar .actions .delete-btn {
            color: #ea4335;
        }
        .selection-toolbar .actions .delete-btn:hover {
            background: rgba(234, 67, 53, 0.15);
        }

        /* ----- 底部输入 ----- */
        .chat-footer {
            padding: 12px 16px 14px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: flex-end;
            gap: 10px;
            flex-shrink: 0;
            border-radius: 0 0 40px 40px;
        }

        .chat-footer .input-wrap {
            flex: 1;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 4px 6px 4px 18px;
            display: flex;
            align-items: flex-end;
            border: 2px solid rgba(255, 255, 255, 0.1);
            transition: border 0.2s, background 0.2s;
            position: relative;
        }

        .chat-footer .input-wrap:focus-within {
            border-color: #4a8ad6;
            background: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 0 4px rgba(74, 138, 214, 0.08);
        }

        .chat-footer .input-wrap textarea {
            flex: 1;
            border: none;
            background: transparent;
            resize: none;
            padding: 10px 0;
            font-size: 15px;
            outline: none;
            font-family: inherit;
            color: #1a2a3a;
            min-height: 24px;
            max-height: 100px;
            line-height: 1.4;
        }
        .chat-footer .input-wrap textarea::placeholder {
            color: #7a8a9e;
        }

        .chat-footer .input-wrap .action-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 6px 6px 6px 4px;
            color: #5a6a7a;
            transition: all 0.2s;
            line-height: 1;
            position: relative;
        }
        .chat-footer .input-wrap .action-btn:hover {
            color: #4a8ad6;
            transform: scale(1.1);
        }
        .chat-footer .input-wrap .action-btn:active {
            transform: scale(0.9);
        }

        .emoji-picker {
            display: none;
            position: absolute;
            bottom: calc(100% + 8px);
            left: 0;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            padding: 12px 14px;
            width: 280px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            border: 1px solid rgba(255, 255, 255, 0.3);
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            justify-items: center;
        }
        .emoji-picker.active {
            display: grid;
        }
        .emoji-picker::-webkit-scrollbar {
            width: 3px;
        }
        .emoji-picker::-webkit-scrollbar-thumb {
            background: rgba(74, 138, 214, 0.3);
            border-radius: 10px;
        }
        .emoji-picker .emoji-item {
            font-size: 26px;
            cursor: pointer;
            padding: 4px;
            border-radius: 10px;
            transition: background 0.15s;
            text-align: center;
            line-height: 1.2;
        }
        .emoji-picker .emoji-item:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        .chat-footer .send-btn {
            background: linear-gradient(135deg, #4a8ad6, #3a7ac6);
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
            box-shadow: 0 8px 24px rgba(74, 138, 214, 0.25);
        }
        .chat-footer .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 32px rgba(74, 138, 214, 0.35);
        }
        .chat-footer .send-btn:active {
            transform: scale(0.92);
        }
        .chat-footer .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ===== 自定义模态框（毛玻璃） ===== */
        .custom-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(15px);
            z-index: 1001;  /* 提高层级，覆盖设置弹窗 */
            justify-content: center;
            align-items: center;
            padding: 24px;
            animation: fadeIn 0.3s ease;
        }
        .custom-modal-overlay.active {
            display: flex;
        }

        .custom-modal {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(30px);
            border-radius: 32px;
            max-width: 400px;
            width: 100%;
            padding: 28px 24px 24px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.3);
            max-height: 90vh;
            overflow-y: auto;
        }

        .custom-modal .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: #1a2a3a;
            margin-bottom: 4px;
            text-align: center;
        }

        .custom-modal .modal-desc {
            font-size: 14px;
            color: #4a5a6a;
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .custom-modal .modal-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .custom-modal .modal-actions .btn {
            flex: 1;
            min-width: 80px;
            padding: 12px;
            border: none;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .custom-modal .modal-actions .btn:active {
            transform: scale(0.97);
        }

        .custom-modal .modal-actions .btn-primary {
            background: linear-gradient(135deg, #4a8ad6, #3a7ac6);
            color: #fff;
            box-shadow: 0 8px 24px rgba(74, 138, 214, 0.25);
        }
        .custom-modal .modal-actions .btn-primary:hover {
            box-shadow: 0 12px 32px rgba(74, 138, 214, 0.35);
        }

        .custom-modal .modal-actions .btn-success {
            background: linear-gradient(135deg, #34a853, #2d8f47);
            color: #fff;
            box-shadow: 0 8px 24px rgba(52, 168, 83, 0.25);
        }
        .custom-modal .modal-actions .btn-success:hover {
            box-shadow: 0 12px 32px rgba(52, 168, 83, 0.35);
        }

        .custom-modal .modal-actions .btn-secondary {
            background: rgba(200, 210, 220, 0.3);
            backdrop-filter: blur(5px);
            color: #2a3a4a;
        }
        .custom-modal .modal-actions .btn-secondary:hover {
            background: rgba(200, 210, 220, 0.5);
        }

        .custom-modal .modal-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 14px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
            font-family: inherit;
            color: #1a2a3a;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(5px);
            margin: 12px 0 16px;
            resize: vertical;
            min-height: 60px;
        }
        .custom-modal .modal-input:focus {
            border-color: #4a8ad6;
            box-shadow: 0 0 0 4px rgba(74, 138, 214, 0.1);
            background: rgba(255, 255, 255, 0.6);
        }

        .custom-modal .modal-info {
            font-size: 13px;
            color: #4a5a6a;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 14px;
            border-radius: 12px;

                try {

                    const h = String(d.getHours()).padStart(2, '0');
                    const m = String(d.getMinutes()).padStart(2, '0');
                    return h + ':' + m;
                } catch (_) { return '刚刚'; }
            }

            function formatDate(isoStr) {
                try {
                    const d = new Date(isoStr);
                    if (isNaN(d.getTime())) return '';
                    const today = new Date();
                    const y = d.getFullYear();
                    const mo = String(d.getMonth() + 1).padStart(2, '0');
                    const day = String(d.getDate()).padStart(2, '0');
                    if (d.toDateString() === today.toDateString()) return '今天';
                    if (d.toDateString() === new Date(today.getTime() - 86400000).toDateString()) return '昨天';
                    return y + '年' + mo + '月' + day + '日';
                } catch (_) { return ''; }

                    } else {
                        fallbackCopy(answerCode);

                    function fallbackCopy(text) {
                        var textarea = document.createElement('textarea');
                        textarea.value = text;
                        document.body.appendChild(textarea);
                        textarea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textarea);

            // ---- JSONBin API ----
            async function fetchMessagesFromBin(apiKey, binId) {
                if (!apiKey || !binId) throw new Error('请先配置 API 密钥和 Bin ID');
                var url = 'https://api.jsonbin.io/v3/b/' + binId;
                var resp = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'X-Master-Key': apiKey,
                        'Content-Type': 'application/json'
                    }
                });
                if (!resp.ok) {
                    var errMsg = 'HTTP ' + resp.status;
                    try {
                        var errData = await resp.json();
                        if (errData.message) errMsg = errData.message;
                    } catch (_) { /* ignore */ }
                    throw new Error(errMsg);
                }
                var data = await resp.json();
                return data.record?.messages || [];
            }

            async function updateMessagesToBin(apiKey, binId, msgs) {
                if (!apiKey || !binId) throw new Error('请先配置 API 密钥和 Bin ID');
                var url = 'https://api.jsonbin.io/v3/b/' + binId;
                var payload = { messages: msgs };
                var resp = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'X-Master-Key': apiKey,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
                if (!resp.ok) {
                    var errMsg = 'HTTP ' + resp.status;
                    try {
                        var errData = await resp.json();
                        if (errData.message) errMsg = errData.message;
                    } catch (_) { /* ignore */ }
                    throw new Error(errMsg);
                }
                return await resp.json();
            }

            // ---- WebRTC 文件传输 ----
            var peerConnection = null;
            var dataChannel = null;
            var fileChunks = [];
            var currentFile = null;
            var isReceiving = false;

            function createOfferForFile(file) {
                return new Promise(function(resolve, reject) {
                    currentFile = file;
                    peerConnection = new RTCPeerConnection({
                        iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
                    });
                    dataChannel = peerConnection.createDataChannel('fileTransfer');
                    dataChannel.binaryType = 'arraybuffer';

                    dataChannel.onopen = function() {
                        showToast('连接已建立，开始发送...', 'success');
                        sendFileChunks();
                    };

                    dataChannel.onerror = function(err) {
                        reject(err);
                    };

                    peerConnection.onicecandidate = function(event) {
                        if (event.candidate) {
                            // 收集候选，不需要额外操作
                        }
                    };

                    peerConnection.createOffer()
                        .then(function(offer) { return peerConnection.setLocalDescription(offer); })
                        .then(function() {
                            var sdp = btoa(peerConnection.localDescription.sdp);
                            resolve(sdp);
                        })
                        .catch(reject);
                });
            }

            function sendFileChunks() {
                var chunkSize = 16384;
                var offset = 0;
                var file = currentFile;

                function sendNext() {
                    if (offset >= file.size) {
                        dataChannel.send(JSON.stringify({ type: 'end', name: file.name }));
                        showToast('✅ 文件发送完成', 'success');
                        return;
                    }
                    var slice = file.slice(offset, offset + chunkSize);
                    var reader = new FileReader();
                    reader.onload = function(e) {
                        var buffer = e.target.result;
                        dataChannel.send(buffer);
                        offset += chunkSize;
                        var progress = Math.round((offset / file.size) * 100);
                        if (progress % 10 === 0) {
                            showToast('发送中：' + progress + '%', 'info');
                        }
                        sendNext();
                    };
                    reader.readAsArrayBuffer(slice);
                }
                sendNext();
            }

            function acceptOffer(encodedSdp) {
                return new Promise(function(resolve, reject) {
                    try {
                        var sdp = atob(encodedSdp);
                        peerConnection = new RTCPeerConnection({
                            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
                        });

                        peerConnection.ondatachannel = function(event) {
                            var channel = event.channel;
                            channel.binaryType = 'arraybuffer';
                            channel.onmessage = function(msg) {
                                handleReceivedData(msg.data);
                            };
                            channel.onclose = function() {
                                if (fileChunks.length > 0) {
                                    var blob = new Blob(fileChunks);
                                    var url = URL.createObjectURL(blob);
                                    var a = document.createElement('a');
                                    a.href = url;
                                    a.download = currentFile ? currentFile.name : 'received_file';
                                    a.click();
                                    URL.revokeObjectURL(url);
                                    showToast('✅ 文件接收完成！', 'success');
                                    fileChunks = [];
                                    currentFile = null;
                                    isReceiving = false;
                                }
                            };
                        };

                        peerConnection.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp }))
                            .then(function() { return peerConnection.createAnswer(); })
                            .then(function(answer) { return peerConnection.setLocalDescription(answer); })
                            .then(function() {
                                var answerSdp = btoa(peerConnection.localDescription.sdp);
                                resolve(answerSdp);
                            })
                            .catch(reject);
                    } catch (e) {
                        reject(e);
                    }
                });
            }

            function acceptAnswer(encodedAnswer) {
                try {
                    var sdp = atob(encodedAnswer);
                    peerConnection.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp }));
                } catch (e) {
                    showToast('应答码无效', 'error');
                }
            }

            function handleReceivedData(data) {
                if (typeof data === 'string') {
                    try {
                        var json = JSON.parse(data);
                        if (json.type === 'end') {
                            currentFile = { name: json.name || 'received_file' };
                            return;
                        }
                    } catch (e) { /* ignore */ }
                    return;
                }
                fileChunks.push(data);
                if (!isReceiving) {
                    isReceiving = true;
                    showToast('正在接收文件...', 'info');
                }
            }

            // ---- 消息渲染 ----
            function renderMessages(msgs) {
                var sorted = msgs.slice().sort(function(a, b) { return new Date(a.time) - new Date(b.time); });
                var items = messagesContainer.querySelectorAll('.message-item, .message-date-divider');
                items.forEach(function(el) { el.remove(); });

                if (sorted.length === 0) {
                    emptyState.style.display = 'flex';
                    return;
                }
                emptyState.style.display = 'none';

                var lastDate = '';

                sorted.forEach(function(msg) {
                    var msgDate = formatDate(msg.time);
                    if (msgDate && msgDate !== lastDate) {
                        lastDate = msgDate;
                        var divider = document.createElement('div');
                        divider.className = 'message-date-divider';
                        divider.innerHTML = '<span>' + msgDate + '</span>';
                        messagesContainer.appendChild(divider);
                    }

                    var isSelf = msg.nickname === currentNickname;
                    var status = msg.status || 'sent';

                    var item = document.createElement('div');
                    item.className = 'message-item ' + (isSelf ? 'self' : 'other');
                    item.dataset.id = msg.id;
                    if (selectMode) {
                        item.classList.add('in-select-mode');
                    }

                    var checkbox = document.createElement('div');
                    checkbox.className = 'checkbox';
                    if (selectedIds.has(msg.id)) {
                        checkbox.classList.add('checked');
                    }
                    item.appendChild(checkbox);

                    var nameEl = document.createElement('div');
                    nameEl.className = 'msg-nickname';
                    nameEl.textContent = isSelf ? '我' : msg.nickname;
                    item.appendChild(nameEl);

                    var wrapper = document.createElement('div');
                    wrapper.className = 'bubble-wrapper';

                    var bubble = document.createElement('div');
                    bubble.className = 'bubble';
                    bubble.innerHTML = linkify(msg.content);
                    wrapper.appendChild(bubble);

                    if (isSelf) {
                        var statusEl = document.createElement('span');
                        statusEl.className = 'msg-status';
                        statusEl.title = status === 'sending' ? '发送中...' :
                            status === 'sent' ? '已发送' :
                            '发送失败，请重试';
                        if (status === 'sending') {
                            var spinner = document.createElement('span');
                            spinner.className = 'spinner';
                            statusEl.appendChild(spinner);
                        } else if (status === 'sent') {
                            statusEl.innerHTML = '✓';
                            statusEl.className += ' status-sent';
                        } else if (status === 'error') {
                            statusEl.innerHTML = '✗';
                            statusEl.className += ' status-error';
                        }
                        wrapper.appendChild(statusEl);
                    }

                    item.appendChild(wrapper);

                    var timeEl = document.createElement('div');
                    timeEl.className = 'msg-time';
                    timeEl.textContent = formatTime(msg.time);
                    item.appendChild(timeEl);

                    // 点击切换选择
                    item.addEventListener('click', function(e) {
                        if (selectMode) {
                            e.stopPropagation();
                            toggleSelectItem(msg.id);
                        }
                    });

                    // 长按进入选择模式
                    var longPressTimer = null;
                    item.addEventListener('mousedown', function(e) {
                        if (selectMode) return;
                        longPressTimer = setTimeout(function() {
                            enterSelectMode(msg.id);
                        }, 500);
                    });
                    item.addEventListener('mouseup', function() { clearTimeout(longPressTimer); });
                    item.addEventListener('mouseleave', function() { clearTimeout(longPressTimer); });
                    item.addEventListener('touchstart', function(e) {
                        if (selectMode) return;
                        longPressTimer = setTimeout(function() {
                            enterSelectMode(msg.id);
                        }, 500);
                    });
                    item.addEventListener('touchend', function() { clearTimeout(longPressTimer); });
                    item.addEventListener('touchmove', function() { clearTimeout(longPressTimer); });

                    messagesContainer.appendChild(item);
                });

                scrollToBottom();
                updateSelectionInfo();
            }

            function scrollToBottom() {
                requestAnimationFrame(function() {
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                });
            }

            function updateMessageStatus(id, status) {
                var msg = messages.find(function(m) { return m.id === id; });
                if (msg) {
                    msg.status = status;
                    localStatusMap.set(id, status);
                }
            }

            function mergeMessages(serverMsgs) {
                return serverMsgs.map(function(msg) {
                    var localStatus = localStatusMap.get(msg.id);
                    if (localStatus) {
                        return { ...msg, status: localStatus };
                    }
                    return { ...msg, status: 'sent' };
                });
            }

            // ---- 选择模式 ----
            function enterSelectMode(initialId) {
                selectMode = true;
                selectedIds.clear();
                if (initialId) selectedIds.add(initialId);
                document.querySelectorAll('.message-item').forEach(function(el) {
                    el.classList.add('in-select-mode');
                    var cb = el.querySelector('.checkbox');
                    if (cb && selectedIds.has(el.dataset.id)) {
                        cb.classList.add('checked');
                    }
                });
                selectionToolbar.classList.add('active');
                updateSelectionInfo();
                showToast('选择消息后点击删除', 'info', 2000);
            }

            function exitSelectMode() {
                selectMode = false;
                selectedIds.clear();
                document.querySelectorAll('.message-item').forEach(function(el) {
                    el.classList.remove('in-select-mode');
                    var cb = el.querySelector('.checkbox');
                    if (cb) cb.classList.remove('checked');
                });
                selectionToolbar.classList.remove('active');
            }

            function toggleSelectItem(id) {
                if (selectedIds.has(id)) {
                    selectedIds.delete(id);
                } else {
                    selectedIds.add(id);
                }
                var item = document.querySelector('.message-item[data-id="' + id + '"]');
                if (item) {
                    var cb = item.querySelector('.checkbox');
                    if (cb) {
                        if (selectedIds.has(id)) cb.classList.add('checked');
                        else cb.classList.remove('checked');
                    }
                }
                updateSelectionInfo();
            }

            function updateSelectionInfo() {
                var count = selectedIds.size;
                selectionInfo.textContent = '已选 ' + count + ' 条';
            }

            // ---- 删除消息 ----
            async function deleteSelectedMessages() {
                if (selectedIds.size === 0) {
                    showToast('请选择要删除的消息', 'error');
                    return;
                }
                var result = await showPasswordModal('请输入删除密码 (默认: gly@12345)');
                if (result.action === 'cancel') {
                    showToast('操作已取消', 'info');
                    return;
                }
                var password = result.password;
                if (password !== DELETE_PASSWORD) {
                    showToast('密码错误，删除取消', 'error');
                    return;
                }

                var idsToDelete = new Set(selectedIds);
                var newMessages = messages.filter(function(msg) { return !idsToDelete.has(msg.id); });
                messages = newMessages;
                idsToDelete.forEach(function(id) { localStatusMap.delete(id); });

                var config = getConfig();
                if (!config.apiKey || !config.binId) {
                    showToast('⚠️ 请先配置 JSONBin', 'error');
                    return;
                }
                try {
                    await updateMessagesToBin(config.apiKey, config.binId, newMessages);
                    showToast('✅ 已删除 ' + idsToDelete.size + ' 条消息', 'success');
                    renderMessages(messages);
                    exitSelectMode();
                } catch (err) {
                    showToast('删除失败: ' + err.message, 'error');
                }
            }

            // ---- 加载消息 ----
            async function loadMessages(showLoading) {
                if (showLoading === undefined) showLoading = true;
                var config = getConfig();
                if (!config.apiKey || !config.binId) {
                    isConfigValid = false;
                    if (showLoading) {
                        renderMessages([]);
                        showToast('⚠️ 请先配置 JSONBin 服务', 'error', 3000);
                        openSettings();
                    }
                    return;
                }
                isConfigValid = true;

                try {
                    var serverMsgs = await fetchMessagesFromBin(config.apiKey, config.binId);
                    var mergedMsgs = mergeMessages(serverMsgs);
                    messages = mergedMsgs;
                    renderMessages(messages);
                    if (isFirstLoad) {
                        isFirstLoad = false;
                        if (messages.length === 0) {
                            var welcomeMsg = {
                                id: generateId(),
                                nickname: '🏫 校园通',
                                content: '👋 欢迎！长按消息可多选删除，点击 📎 可传文件（WebRTC）',
                                time: new Date().toISOString(),
                                status: 'sent'
                            };
                            await sendMessageInternal(welcomeMsg, true);
                        }
                    }
                } catch (err) {
                    console.error('加载消息失败:', err);
                    showToast('📡 加载消息失败: ' + err.message, 'error', 3000);
                    if (err.message.includes('配置') || err.message.includes('API') || err.message.includes('HTTP 401') || err
                        .message.includes('403')) {
                        openSettings();
                    }
                }
            }

            // ---- 发送消息（内部） ----
            async function sendMessageInternal(msgObj, silent) {
                if (silent === undefined) silent = false;
                var config = getConfig();
                if (!config.apiKey || !config.binId) {
                    if (!silent) showToast('⚠️ 请先配置 JSONBin 服务', 'error', 3000);
                    openSettings();
                    return false;
                }

                try {
                    var currentMsgs = [];
                    try {
                        currentMsgs = await fetchMessagesFromBin(config.apiKey, config.binId);
                    } catch (_) {
                        currentMsgs = [];
                    }
                    var serverMsg = { ...msgObj };
                    delete serverMsg.status;
                    currentMsgs.push(serverMsg);
                    await updateMessagesToBin(config.apiKey, config.binId, currentMsgs);
                    return true;
                } catch (err) {
                    console.error('发送消息失败:', err);
                    if (!silent) {
                        showToast('❌ 发送失败: ' + err.message, 'error', 3000);
                    }
                    return false;
                }
            }

            // ---- 用户发送文字消息 ----
            async function sendUserMessage() {
                if (isSending) return;
                var content = msgInput.value.trim();
                if (!content) {
                    msgInput.focus();
                    return;
                }
                if (!currentNickname) {
                    showToast('⚠️ 请先设置昵称', 'error', 2000);
                    return;
                }

                var config = getConfig();
                if (!config.apiKey || !config.binId) {
                    showToast('⚠️ 请先配置 JSONBin 服务', 'error', 3000);
                    openSettings();
                    return;
                }

                isSending = true;
                sendBtn.disabled = true;
                attachBtn.disabled = true;

                var msgId = generateId();
                var msgObj = {
                    id: msgId,
                    nickname: currentNickname,
                    content: content,
                    time: new Date().toISOString(),
                    status: 'sending'
                };

                messages.push(msgObj);
                localStatusMap.set(msgId, 'sending');
                renderMessages(messages);

                msgInput.value = '';
                msgInput.style.height = 'auto';
                msgInput.focus();

                var success = await sendMessageInternal(msgObj, true);
                if (success) {
                    updateMessageStatus(msgId, 'sent');
                    renderMessages(messages);
                    await loadMessages(false);
                } else {
                    updateMessageStatus(msgId, 'error');
                    renderMessages(messages);
                    showToast('❌ 发送失败，请检查网络或配置', 'error', 3000);
                }

                isSending = false;
                sendBtn.disabled = false;
                attachBtn.disabled = false;
            }

            // ---- 文件传输入口（优化引导） ----
            async function handleFileTransfer() {
                if (isSending) return;
                if (!currentNickname) {
                    showToast('⚠️ 请先设置昵称', 'error', 2000);
                    return;
                }
                var config = getConfig();
                if (!config.apiKey || !config.binId) {
                    showToast('⚠️ 请先配置 JSONBin 服务', 'error', 3000);
                    openSettings();
                    return;
                }

                var result = await showFileTransferModal();
                if (result.action === 'cancel') return;

                if (result.action === 'send') {
                    var input = document.createElement('input');
                    input.type = 'file';
                    input.style.display = 'none';
                    document.body.appendChild(input);
                    input.onchange = async function(e) {
                        var file = e.target.files[0];
                        if (!file) {
                            document.body.removeChild(input);
                            return;
                        }
                        try {
                            showToast('正在生成连接码...', 'info');
                            var offerCode = await createOfferForFile(file);
                            msgInput.value = '📎 文件传输连接码：' + offerCode;
                            await sendUserMessage();
                            // 弹窗提示等待应答码
                            var answerResult = await showInputCodeModal('已发送连接码，请等待接收方生成应答码并粘贴到下方');
                            if (answerResult.action === 'cancel') {
                                showToast('传输已取消', 'error');
                                document.body.removeChild(input);
                                return;
                            }
                            var answerCode = answerResult.code;
                            if (answerCode) {
                                acceptAnswer(answerCode);
                                showToast('✅ 连接建立，开始传输...', 'success');
                            } else {
                                showToast('应答码无效', 'error');
                            }
                        } catch (err) {
                            showToast('错误: ' + err.message, 'error');
                        } finally {
                            document.body.removeChild(input);
                        }
                    };
                    input.click();
                } else if (result.action === 'receive') {
                    var codeResult = await showInputCodeModal('请粘贴发送方提供的连接码');
                    if (codeResult.action === 'cancel') return;
                    var offerCode = codeResult.code;
                    if (!offerCode) {
                        showToast('连接码不能为空', 'error');
                        return;
                    }
                    try {
                        var answerCode = await acceptOffer(offerCode);
                        await showAnswerModal(answerCode, '应答码已自动复制，请粘贴到聊天中发给发送方');
                        showToast('等待发送方确认...', 'info');
                    } catch (err) {
                        showToast('接收失败: ' + err.message, 'error');
                    }
                }
            }

            // ---- 轮询 ----
            function startPolling() {
                stopPolling();
                pollingTimer = setInterval(async function() {
                    var config = getConfig();
                    if (!config.apiKey || !config.binId) return;
                    try {
                        var serverMsgs = await fetchMessagesFromBin(config.apiKey, config.binId);
                        var merged = mergeMessages(serverMsgs);
                        if (merged.length !== messages.length) {
                            messages = merged;
                            renderMessages(messages);
                        } else {
                            var changed = false;
                            for (var i = 0; i < merged.length; i++) {
                                var a = messages[i];
                                var b = merged[i];
                                if (a.id !== b.id || a.content !== b.content || a.nickname !== b.nickname) {
                                    changed = true;
                                    break;
                                }
                            }
                            if (changed) {
                                messages = merged;
                                renderMessages(messages);
                            }
                        }
                    } catch (err) {
                        console.warn('轮询失败:', err.message);
                    }
                }, 3000);
            }

            function stopPolling() {
                if (pollingTimer) {
                    clearInterval(pollingTimer);
                    pollingTimer = null;
                }
            }

            // ---- UI 控制 ----
            function enterChat() {
                var name = nicknameInput.value.trim();
                if (!name) {
                    showToast('⚠️ 请输入你的昵称', 'error', 2000);
                    nicknameInput.focus();
                    return;
                }

                saveNickname(name);
                userBadgeName.textContent = name;
                userAvatar.textContent = name.charAt(0).toUpperCase();

                chatPage.style.display = 'flex';

                isFirstLoad = true;
                loadMessages(true);

            function exitChat() {
                stopPolling();
                chatPage.style.display = 'none';
                loginPage.style.display = 'flex';
                nicknameInput.value = currentNickname || '';
                nicknameInput.focus();
                if (selectMode) exitSelectMode();

            function openSettings() {
                var config = getConfig();
                apiKeyInput.value = config.apiKey || '';
                binIdInput.value = config.binId || '';
                settingsStatus.className = 'status-msg';
                settingsStatus.textContent = '';
                settingsModal.classList.add('active');
            }

            function closeSettings() {
                settingsModal.classList.remove('active');
            }

            function saveSettings() {
                var apiKey = apiKeyInput.value.trim();
                var binId = binIdInput.value.trim();

                if (!apiKey || !binId) {
                    settingsStatus.className = 'status-msg error';
                    settingsStatus.textContent = '⚠️ 请填写完整的 API 密钥和 Bin ID';
                    return;
                }

                settingsStatus.className = 'status-msg';
                settingsStatus.textContent = '⏳ 测试连接中...';
                settingsStatus.style.display = 'block';

                fetchMessagesFromBin(apiKey, binId)
                    .then(function() {
                        saveConfig(apiKey, binId);
                        settingsStatus.className = 'status-msg success';
                        settingsStatus.textContent = '✅ 配置已保存，连接成功！';
                        isConfigValid = true;
                        showToast('✅ 配置已保存', 'success', 2000);
                        setTimeout(function() {
                            closeSettings();
                            if (chatPage.style.display === 'flex') {
                                loadMessages(true);
                            }
                        }, 600);
                    })
                    .catch(function(err) {
                        settingsStatus.className = 'status-msg error';
                        settingsStatus.textContent = '❌ 连接失败: ' + err.message + '。请检查密钥和 Bin ID';
                        settingsStatus.style.display = 'block';
                        showToast('❌ 连接失败，请检查配置', 'error', 3000);
                    });
            }

            async function applyDefaultSettings() {
                var result = await showPasswordModal('请输入默认配置密码 (预设: rasznb666)');
                if (result.action === 'cancel') {
                    showToast('操作已取消', 'info');
                    return;
                }
                var password = result.password;
                if (password !== PRESET_PASSWORD) {
                    showToast('❌ 密码错误，无法应用默认配置', 'error', 2500);
                    return;
                }

                if (PRESET_API_KEY === '你的默认API密钥' || PRESET_BIN_ID === '你的默认Bin ID') {
                    showToast('⚠️ 预设配置未设置，请先修改代码中的 PRESET_API_KEY 和 PRESET_BIN_ID', 'error', 4000);
                    return;
                }

                saveConfig(PRESET_API_KEY, PRESET_BIN_ID);
                apiKeyInput.value = '';
                binIdInput.value = '';
                settingsStatus.className = 'status-msg success';
                settingsStatus.textContent = '✅ 已应用默认配置（密钥已隐藏）';
                settingsStatus.style.display = 'block';
                isConfigValid = true;
                showToast('✅ 默认配置已应用', 'success', 2000);

                setTimeout(function() {
                    closeSettings();
                    if (chatPage.style.display === 'flex') {
                        loadMessages(true);
                    }
                }, 600);
            }

            // ---- 表情选择器 ----
            var faceEmojis = [
                '😀', '😁', '😂', '🤣', '😃', '😄', '😅', '😆', '😉', '😊', '😋', '😎',
                '😍', '🥰', '😘', '😗', '😙', '😚', '☺️', '🙂', '🤗', '🤩', '🤔', '🤨',
                '😐', '😑', '😶', '🙄', '😏', '😣', '😥', '😮', '🤐', '😯', '😪', '😫',
                '😴', '😌', '😛', '😜', '😝', '🤤', '😒', '😓', '😔', '😕', '🙃', '🤑',
                '😲', '☹️', '🙁', '😖', '😞', '😟', '😤', '😢', '😭', '😦', '😧', '😨',
                '😩', '🤯', '😬', '😰', '😱', '🥵', '🥶', '😳', '🤪', '😵', '😡', '😠',
                '🤬', '😷', '🤒', '🤕', '🤢', '🤮', '🥴', '😵‍💫', '🤧', '🥳', '🥺', '🧐',
                '🤓', '😈', '👿', '👹', '👺', '💀', '👻', '👽', '🤖', '🎃', '😺', '😸',
                '😹', '😻', '😼', '😽', '🙀', '😿', '😾'
            ];

            function buildEmojiPicker() {
                emojiPicker.innerHTML = '';
                faceEmojis.forEach(function(emoji) {
                    var span = document.createElement('span');
                    span.className = 'emoji-item';
                    span.textContent = emoji;
                    span.dataset.emoji = emoji;
                    span.addEventListener('click', function(e) {
                        e.stopPropagation();
                        var emojiChar = span.dataset.emoji;
                        insertEmojiAtCursor(emojiChar);
                        emojiPicker.classList.remove('active');
                    });
                    emojiPicker.appendChild(span);
                });
            }
            buildEmojiPicker();

            function insertEmojiAtCursor(emoji) {
                var start = msgInput.selectionStart;
                var end = msgInput.selectionEnd;
                var current = msgInput.value;
                msgInput.value = current.substring(0, start) + emoji + current.substring(end);
                msgInput.focus();
                var newPos = start + emoji.length;
                msgInput.setSelectionRange(newPos, newPos);
                autoResizeTextarea();
            }

            function toggleEmojiPicker(e) {
                e.stopPropagation();
                var isActive = emojiPicker.classList.contains('active');
                emojiPicker.classList.toggle('active');
                if (!isActive) {
                    document.addEventListener('click', closeEmojiPickerOutside);
                } else {
                    document.removeEventListener('click', closeEmojiPickerOutside);
                }
            }

            function closeEmojiPickerOutside(e) {
                if (!emojiPicker.contains(e.target) && e.target !== emojiBtn) {
                    emojiPicker.classList.remove('active');
                    document.removeEventListener('click', closeEmojiPickerOutside);
                }
            }

            function autoResizeTextarea() {
                msgInput.style.height = 'auto';
                msgInput.style.height = Math.min(msgInput.scrollHeight, 100) + 'px';
            }

            function onKeydown(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendUserMessage();
                }
            }

            // ---- 初始化 ----
            function init() {
                var savedName = getNickname();
                if (savedName) {
                    nicknameInput.value = savedName;
                    currentNickname = savedName;
                }

                var config = getConfig();
                if (config.apiKey && config.binId) {
                    isConfigValid = true;
                } else {
                    setTimeout(function() {
                        if (!isConfigValid) {
                            showToast('📡 首次使用，请配置 JSONBin 服务', 'info', 4000);
                            openSettings();
                        }
                    }, 800);
                }

                // ---- 事件绑定 ----
                enterChatBtn.addEventListener('click', enterChat);
                nicknameInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') enterChat();
                });

                backToLoginBtn.addEventListener('click', exitChat);

                sendBtn.addEventListener('click', sendUserMessage);
                msgInput.addEventListener('keydown', onKeydown);
                msgInput.addEventListener('input', autoResizeTextarea);

                emojiBtn.addEventListener('click', toggleEmojiPicker);
                attachBtn.addEventListener('click', handleFileTransfer);

                settingsBtn.addEventListener('click', openSettings);
                settingsCancelBtn.addEventListener('click', closeSettings);
                settingsSaveBtn.addEventListener('click', saveSettings);
                defaultSettingsBtn.addEventListener('click', applyDefaultSettings);

                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape' && settingsModal.classList.contains('active')) {
                        closeSettings();
                    }
                });

                cancelSelectBtn.addEventListener('click', exitSelectMode);
                deleteSelectedBtn.addEventListener('click', deleteSelectedMessages);

                if (!savedName) {
                    setTimeout(function() { nicknameInput.focus(); }, 400);
                } else {
                    setTimeout(function() {
                        if (loginPage.style.display !== 'none') {
                            nicknameInput.focus();
                        }
                    }, 400);
                }
            }

            init();

        })();
    </script>
</body>
</html>
